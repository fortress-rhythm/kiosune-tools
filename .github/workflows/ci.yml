name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pytest

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-kiosune
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx --yes @vscode/vsce package --out kiosune.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: kiosune-vsix
          path: vscode-kiosune/kiosune.vsix
