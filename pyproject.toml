[project]
name = "kiosune-tools"
version = "0.1.0"
description = "Unofficial tools for Kiosune Studio scripts: a flow check, an FX-pass diff, a bitmap-font packer and a credits sheet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Only the font packer needs these; the checkers and the credits sheet are standard library.
font = [
    "numpy>=1.26",
    "pillow>=10.2",
]

[project.scripts]
kio-check = "kiosune_tools.kio_check:main"
fx-diff = "kiosune_tools.fx_diff:main"
kiosune-font = "kiosune_tools.kiosune_font:main"
kiosune-credits = "kiosune_tools.credits:main"

[project.urls]
Repository = "https://github.com/fortress-rhythm/kiosune-tools"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "numpy>=1.26",
    "pillow>=10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiosune_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
